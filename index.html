<!DOCTYPE html>
<html>    
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>FE2 Map Creation: Audio IO</title>
        <link rel="stylesheet" href="css/style.css">
    </head>

    <body>
        <main>
            <h1>FE2 Map Creation: Audio IO</h1>
            <p>Audio database for FE2 Map Creation</p>
        </main>

        <nav class="navbar">
            <div class="navbar-RobloxUser">UserName</div>
            <input
                text="text",
                class="navbar-TextBox",
                placeholder="Enter Roblox UserName"
            />
            <button class="navbar-Button" type="button">
                Submit
            </button>
        </nav>

        <script>
            document.querySelector(".navbar-Button").addEventListener("click", () => {
                const text = document.querySelector(".navbar-TextBox").value.trim();

                if (text == "") {
                    alert("Error: Please type your Roblox UserName Account.");
                    return;
                }
                
                console.log(`Checking Roblox User Account: @${text}`);
            });
        </script>
    </body>
</html>
