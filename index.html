<!DOCTYPE html>
<html>    
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>FE2 Map Creation: Audio IO</title>
        <link rel="stylesheet" href="css/index.css">
    </head>

    <body>
        <main>
            <div class="logo"></div>
            <p>Audio database for FE2 Map Creation</p>
        </main>

        <nav class="navbar">
            <div class="navbar-Title">Roblox UserName</div>
            
            <input
                type="text"
                class="navbar-TextBox"
                placeholder="Enter Roblox UserName"
            />
            <button class="navbar-Button" type="button">
                Submit
            </button>

            <div class="navbar-Title">Audio Adjustment</div>
            
            <div class="navbar-Volume">
                <label for="volumeSlider">Volume</label>
                
                <input
                    type="range"
                    id="volumeSlider"
                    min="0"
                    max="100"
                    value="75"
                />

                <span id="volumeValue">75%</span>
            </div>

            <div class="navbar-AudioOptions">
                <label style="font-size: 22px;">Audio Options</label>

                <button
                    type="button"
                    class="navbar-AllowEffect"
                    aria-pressed="true"
                >
                    Allow Effect
                </button>
                <button
                    type="button"
                    class="navbar-AllowControl"
                    aria-pressed="true"
                >
                    Allow Control
                </button>
            </div>

            <div class="navbar-Choices" id="OnDeath">
                <label style="font-size: 22px;">On Death</label>

                <button
                    type="button"
                    id="QuietenBGM"
                    class="navbar-Selecter"
                    data-selected="true"
                >
                    Quieten BGM
                </button>
                <button
                    type="button"
                    id="StopBGM"
                    class="navbar-Selecter"
                    data-selected="false"
                >
                    Stop BGM
                </button>
                <button
                    type="button"
                    id="Disable"
                    class="navbar-Selecter"
                    data-selected="false"
                >
                    Disable
                </button>
            </div>

            <div class="navbar-Choices" id="OnLeave">
                <label style="font-size: 22px;">Leaving Game</label>

                <button
                    type="button"
                    id="StopBGM"
                    class="navbar-Selecter"
                    data-selected="true"
                >
                    Stop BGM
                </button>
                <button
                    type="button"
                    id="Disable"
                    class="navbar-Selecter"
                    data-selected="false"
                >
                    Disable
                </button>
            </div>

            <div class="navbar-Title">Roblox Statement</div>

            <div class="navbar-PlayerTracker">
                <div class="navbar-PlayerData">
                    <label style="font-size: 22px;">Player Tracker</label>

                    <p>PlayerName: <span id="PlayerName">n/a</span></p>
                    <p>IsPlaying: <span id="IsPlaying">n/a</span></p>
                    <p>InMainGame: <span id="InMainGame">n/a</span></p>
                </div>

                <div class="navbar-AudioData">
                    <label style="font-size: 22px;">Audio Tracker</label>

                    <p>AudioName: <span id="AudioName">n/a</span></p>
                    <p>AudioID: <span id="AudioID">n/a</span></p>
                    <p>AudioPlaying: <span id="AudioPlaying">n/a</span></p>
                    <p>AudioFading: <span id="AudioFading">n/a</span></p>
                </div>
            </div>
        </nav>

        <script type="module" src="src/pages/Main.js"></script>
    </body>
</html>
