<!DOCTYPE html>
<html>    
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>FE2 Map Creation: Audio IO</title>
        <link rel="stylesheet" href="css/style.css">
    </head>

    <body>
        <main>
            <h1>FE2 Map Creation: Audio IO</h1>
            <p>Audio database for FE2 Map Creation</p>
        </main>

        <nav class="navbar">
            <div class="navbar-RobloxUser">UserName</div>
            <input
                type="text"
                class="navbar-TextBox"
                placeholder="Enter Roblox UserName"
            />
            <button class="navbar-Button" type="button">
                Submit
            </button>

            <div class="navbar-Audio">Audio Adjustment</div>
            
            <div class="navbar-Volume">
                <label for="volumeSlider">Volume</label>
                
                <input
                    type="range"
                    id="volumeSlider"
                    min="0"
                    max="100"
                    value="75"
                />

                <span id="volumeValue">75%</span>
            </div>
        </nav>

        <script type="module" src="js/instance/navbar-Button.js"></script>
        <script type="module" src="js/instance/navbar-Volume.js"></script>
    </body>
</html>
